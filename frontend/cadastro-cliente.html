<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f6">
    <meta name="description" content="Cadastro de cliente da Clínica Veterinária Focinho & Cia.">
    <title>Cadastro de cliente | SGCV</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/cadastro-cliente.js" defer></script>
  </head>
  <body class="client-page">
    <header class="client-header">
      <a class="brand" href="/" aria-label="SGCV, página inicial">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>SGCV</span>
      </a>
      <a class="client-back-link" href="/">Voltar ao sistema</a>
    </header>

    <main class="client-main">
      <section class="client-card" aria-labelledby="client-form-title">
        <header class="form-heading">
          <p class="eyebrow">CLIENTES</p>
          <h1 id="client-form-title">Cadastrar cliente</h1>
          <p>Preencha os dados do tutor para cadastrá-lo no sistema.</p>
        </header>

        <div id="client-form-message" class="form-message" role="status" aria-live="polite"></div>

        <form id="client-form" class="client-form" autocomplete="on">
          <div class="field">
            <label for="client-name">Nome completo</label>
            <input id="client-name" name="nome" type="text" placeholder="Nome do tutor"
              maxlength="120" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="client-cpf">CPF</label>
            <input id="client-cpf" name="cpf" type="text" placeholder="000.000.000-00"
              inputmode="numeric" maxlength="14" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="client-phone">Telefone</label>
            <input id="client-phone" name="telefone" type="tel" placeholder="(00) 00000-0000"
              maxlength="20" autocomplete="tel" required>
          </div>
          <div class="field">
            <label for="client-email">E-mail <span>(opcional)</span></label>
            <input id="client-email" name="email" type="email" placeholder="nome@exemplo.com"
              maxlength="254" autocomplete="email">
          </div>
          <div class="field field-full">
            <label for="client-address">Endereço <span>(opcional)</span></label>
            <input id="client-address" name="endereco" type="text" placeholder="Rua, número, bairro e cidade"
              maxlength="250" autocomplete="street-address">
          </div>
          <button class="primary-button" type="submit">Cadastrar cliente</button>
        </form>
      </section>
    </main>

    <footer class="login-footer client-footer">
      <span>SGCV</span>
      <span>Sistema de Gestão de Clínica Veterinária</span>
    </footer>
  </body>
</html>
